<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login - {{ business_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Montserrat:wght@600;700;800&family=Noto+Sans+Devanagari:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: #07090d;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
    }
    .login-card {
      background: rgba(14, 19, 29, 0.92);
      border: 1.5px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 32px 26px;
      box-shadow: 0 0 35px rgba(255, 214, 10, 0.15), 0 20px 40px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
    }
    .logo-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2.5px solid var(--gold-primary);
      box-shadow: 0 0 20px var(--gold-glow);
      margin-bottom: 12px;
    }
    .business-title {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--gold-primary);
      letter-spacing: 0.05em;
      line-height: 1.1;
      text-shadow: 0 2px 10px rgba(255, 214, 10, 0.3);
    }
    .business-sub {
      font-size: 0.78rem;
      color: #cbd5e1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 2px;
    }
    .marathi-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 18px;
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      color: #14161c;
      background: linear-gradient(180deg, #ffe58a, #ffd60a);
      border-radius: var(--radius-full);
    }
    .welcome-heading {
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      margin: 18px 0 6px;
      color: #ffffff;
    }
    .welcome-heading span {
      color: var(--gold-primary);
    }
    .welcome-sub {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }
    .input-wrapper svg.field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 20px;
      height: 20px;
    }
    .login-input {
      width: 100%;
      height: 52px;
      background: #101522;
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-md);
      padding: 0 44px 0 44px;
      font-size: 0.95rem;
      color: #fff;
      outline: none;
      transition: all 0.2s;
    }
    .login-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: grid;
      place-items: center;
    }
    .password-toggle-btn:hover {
      color: var(--gold-primary);
    }
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 0.85rem;
    }
    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .remember-label input[type="checkbox"] {
      accent-color: var(--gold-primary);
      width: 16px;
      height: 16px;
    }
    .forgot-btn {
      background: none;
      border: none;
      color: var(--gold-primary);
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
    }
    .forgot-btn:hover {
      text-decoration: underline;
    }
    .login-submit-btn {
      width: 100%;
      height: 54px;
      background: linear-gradient(180deg, #ffe58a 0%, #ffd60a 50%, #f59e0b 100%);
      color: #14161c;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--gold-glow);
      transition: all 0.2s;
    }
    .login-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 214, 10, 0.4);
    }
    .contact-admin {
      text-align: center;
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .contact-admin a {
      color: var(--gold-primary);
      font-weight: 600;
      margin-left: 6px;
    }
    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-header">
        <img src="{{ url_for('static', filename='images/moraya_logo.jpg') }}" alt="Moraya Electric Logo" class="login-logo">
        <h1 class="business-title">{{ business_name }}</h1>
        <div class="business-sub">{{ business_tagline }}</div>
        <div><span class="marathi-badge">मोरया इलेक्ट्रिक</span></div>
      </div>

      <div class="welcome-heading">Welcome <span>Back!</span></div>
      <div class="welcome-sub">Login to your account and continue managing your business.</div>

      {% if error %}
        <div class="error-banner">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" name="email" class="login-input" placeholder="Email Address" required autofocus value="{{ request.form.get('email', '') }}">
        </div>

        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="loginPassword" name="password" class="login-input" placeholder="Password" required>
          <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>

        <div class="form-options">
          <label class="remember-label">
            <input type="checkbox" name="remember" checked>
            <span>Remember Me</span>
          </label>
          <button type="button" class="forgot-btn" onclick="alert('For security reasons, password resets must be authorized by the administrator. Contact: {{ business_phone }}')">Forgot Password?</button>
        </div>

        <button type="submit" class="login-submit-btn">
          <span>Login</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
        </button>
      </form>

      <div class="contact-admin">
        Don’t have an account? <a href="tel:7083155192">Contact Admin</a>
      </div>
    </div>
  </div>

  <script>
    const pwdInput = document.getElementById('loginPassword');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        toggleBtn.style.color = isPwd ? 'var(--gold-primary)' : 'var(--text-muted)';
      });
    }
  </script>
</body>
</html>
